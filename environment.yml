# Environment for running the Recidivism Case Study notebooks locally.
# Create it with:
#     mamba env create -f environment.yml     (or conda env create ...)
#     conda activate RecidivismCaseStudy
#
# requirements.txt lists the same dependencies for pip, and is what CI
# installs; keep the two in step.

name: RecidivismCaseStudy

channels:
  - conda-forge

dependencies:
  - python=3.13
  - jupyter
  - matplotlib
  - numpy
  - pandas
  - scikit-learn    # 07_diy
  - scipy
  - statsmodels
  - sympy           # 04_matrix

  # for make tests and make format
  - pytest
  - nbmake
  - ruff
